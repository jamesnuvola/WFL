name: Update Win for Life data
on:
  push:
    paths:
      - 'update-wlf.mjs'
      - '.github/workflows/update-data.yml'
  schedule:
    # The runner itself polls every five minutes, so one missed cron does not stop refreshes.
    - cron: '1-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wfl-data-maintenance-v3
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate source policy before polling
        run: |
          node --check update-wlf.mjs
          node --check wfl-source-policy.mjs
          node tests/test-source-policy.mjs
      - name: Poll official sources and publish the latest confirmed draw
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # Each five-minute schedule performs exactly one refresh. A long in-job
          # sleep loop would keep the concurrency lock for nearly an hour and queue
          # newer refreshes behind stale runs.
          git pull --rebase origin main
          node update-wlf.mjs
          git add winforlife_draws.json debug-wlf.html data/archive
          if ! git diff --staged --quiet; then
            git commit -m "Update WFL history without data loss"
            git pull --rebase origin main
            git push
            echo "Published updated WFL history."
          else
            echo "Archive already current; no commit needed."
          fi
