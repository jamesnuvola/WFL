name: Update Win for Life data
on:
  push:
    paths:
      - 'update-wlf.mjs'
      - '.github/workflows/update-data.yml'
  schedule:
    # Avoid the top-of-hour Actions load; keep a five-minute cadence.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wfl-data-maintenance
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch latest draws with bounded retries
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "WFL data sync attempt ${attempt}/3"
            if node update-wlf.mjs; then
              exit 0
            fi
            if [ "${attempt}" -lt 3 ]; then
              echo "Source not ready or transient failure; retrying in 60 seconds."
              sleep 60
            fi
          done
          echo "WFL data sync failed after three attempts."
          exit 1
      - name: Commit data and immutable snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add winforlife_draws.json debug-wlf.html data/archive
          if ! git diff --staged --quiet; then
            git commit -m "Update WFL history without data loss"
            git pull --rebase origin main
            git push
          else
            echo "No archive changes to commit."
          fi
