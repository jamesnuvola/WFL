name: Update Win for Life data
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wfl-data-maintenance
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Parse latest archive page and merge without loss
        run: node update-wlf.mjs
      - name: Commit data and immutable snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add winforlife_draws.json debug-wlf.html data/archive
          git diff --staged --quiet || (git commit -m "Update WFL history without data loss" && git push)
