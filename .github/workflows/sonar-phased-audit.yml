name: WFL SONAR phased official archive audit
on:
  push:
    paths:
      - 'audit-wfl-sonar-phased.mjs'
      - '.github/workflows/sonar-phased-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wfl-sonar-phased-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate audit script syntax
        run: node --check audit-wfl-sonar-phased.mjs
      - name: Phase 1 - audit last 12 months
        run: node audit-wfl-sonar-phased.mjs recent
      - name: Phase 2 - audit and safely repair verified full history
        run: node audit-wfl-sonar-phased.mjs full
      - name: Commit reports, backup, and verified archive repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/archive/wfl-sonar-audit-phase1-last12months.json data/archive/wfl-sonar-audit-phase2-full-history.json data/archive/audit-wfl-sonar-phased.mjs.pre-fix-20261013.bak
          git add data/archive/winforlife_draws_pre_sonar_audit_*.json data/archive/wfl-sonar-audit-phase1-last12months.json.pre-*.bak data/archive/wfl-sonar-audit-phase2-full-history.json.pre-*.bak data/archive/.wfl-sonar-cache.json.pre-*.bak winforlife_draws.json
          if ! git diff --staged --quiet; then
            git commit -m "Run phased official WFL SONAR archive audit"
            git pull --rebase origin main
            git push
          else
            echo "No audit report or archive changes."
          fi
