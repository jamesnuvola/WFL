name: WFL SONAR continuous research
on:
  push:
    paths:
      - 'sonar-research-cycle.mjs'
      - 'sonar-temporal-lab.mjs'
      - 'sonar-feature-lab.mjs'
      - 'wfl-sonar-engine.js'
      - '.github/workflows/auto-calibrate.yml'
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wfl-sonar-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate history and run walk-forward strategy comparison
        run: node sonar-research-cycle.mjs
      - name: Run temporal, intraday and repeated-sequence research
        run: node sonar-temporal-lab.mjs
      - name: Run WFL cross-game feature ablation
        run: node sonar-feature-lab.mjs
      - name: Persist research logs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/sonar-research-log.json data/sonar-temporal-log.json data/sonar-feature-log.json
          if ! git diff --staged --quiet; then
            git commit -m "Record WFL SONAR walk-forward, temporal and feature research"
            git pull --rebase origin main
            git push
          fi
