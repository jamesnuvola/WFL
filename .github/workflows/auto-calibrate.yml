name: WFL SONAR continuous research
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wfl-sonar-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate history and run walk-forward strategy comparison
        run: node sonar-research-cycle.mjs
      - name: Persist research log
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/sonar-research-log.json
          git diff --staged --quiet || (git commit -m "Record WFL SONAR walk-forward research" && git push)
