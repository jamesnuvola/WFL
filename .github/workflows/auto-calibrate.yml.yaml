name: Auto-calibrazione Win for Life

on:
  schedule:
    - cron: '0 7 * * *'   # ogni giorno alle 07:00 UTC
  workflow_dispatch:       # per esecuzione manuale

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Run calibration script
        run: node auto-calibrate-wlf.mjs
      - name: Commit and push updated weights
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add weights.json
          git diff --staged --quiet || (git commit -m "Aggiornamento automatico pesi" && git push)