name: WFL SONAR full-history backfill
on:
  push:
    paths:
      - 'backfill-wlf.mjs'
      - '.github/workflows/backfill-history.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: wfl-data-maintenance
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch next historical date chunk
        run: node backfill-wlf.mjs
      - name: Disable backfill workflow when archive coverage is complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEXT_DATE=$(node -p "JSON.parse(require('fs').readFileSync('data/archive/backfill-state.json','utf8')).nextDate")
          TODAY=$(date -u +%F)
          if [[ "$NEXT_DATE" > "$TODAY" ]]; then
            gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/backfill-history.yml/disable"
            echo "Backfill reached current date; workflow disabled."
          else
            echo "Backfill continues from $NEXT_DATE."
          fi
      - name: Commit merged history and checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add winforlife_draws.json data/archive
          git diff --staged --quiet || (git commit -m "Backfill WFL historical archive" && git push)
