name: WFL SONAR full-history backfill
on:
  schedule:
    - cron: '20 8 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wfl-history-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch next historical date chunk
        run: node backfill-wlf.mjs
      - name: Commit merged history and checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add winforlife_draws.json data/archive
          git diff --staged --quiet || (git commit -m "Backfill WFL historical archive" && git push)
